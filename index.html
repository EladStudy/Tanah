<style>
/* Layout: one column study page, sticky chip nav of chapters, each chapter = summary → key terms → self-test quiz */
:root{
  --bg:#f4f6f3; --card:#ffffff; --fg:#17262a; --muted:#566669; --line:#d6dcd8;
  --accent:#0e6a68; --accent-fg:#ffffff; --accent-soft:#dcefed;
  --sand:#8f5f14; --sand-soft:#f3e8d2;
  --ok:#17703a; --ok-soft:#dff1e4; --bad:#b3261e; --bad-soft:#f8e1de;
  --f-body:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;
  --f-head:'Frank Ruhl Libre','David Libre',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a1c; --card:#172427; --fg:#e6eeec; --muted:#9bb0ad; --line:#2a3b3e;
    --accent:#5ec8c2; --accent-fg:#06201f; --accent-soft:#183835;
    --sand:#e0b25e; --sand-soft:#2f2816;
    --ok:#6fd28f; --ok-soft:#173424; --bad:#ff8a80; --bad-soft:#3a1d1a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101a1c; --card:#172427; --fg:#e6eeec; --muted:#9bb0ad; --line:#2a3b3e;
  --accent:#5ec8c2; --accent-fg:#06201f; --accent-soft:#183835;
  --sand:#e0b25e; --sand-soft:#2f2816;
  --ok:#6fd28f; --ok-soft:#173424; --bad:#ff8a80; --bad-soft:#3a1d1a; color-scheme:dark;
}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.7;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}

header.top{padding-block:28px 14px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
header.top h1{font-family:var(--f-head);font-weight:900;font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:15px}
.exam{display:inline-block;margin-top:10px;background:var(--sand-soft);color:var(--sand);padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
.tbtn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}

nav.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-right,0px))}
nav.chips .row{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.chip[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip[aria-current="true"] small{color:inherit;opacity:.85}
.chip.full small{color:var(--ok)}
.chip.full[aria-current="true"] small{color:inherit}

main{padding-block:26px}
.eyebrow{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:.04em}
h2.title{font-family:var(--f-head);font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1.2;margin:4px 0 18px;text-wrap:balance}
h3{font-family:var(--f-head);font-weight:700;font-size:22px;margin:30px 0 8px;line-height:1.3;text-wrap:balance}
h4{font-size:17px;margin:18px 0 4px;color:var(--accent)}
p{margin:0 0 12px}
ul{margin:0 0 12px;padding-inline-start:22px}
li{margin-bottom:5px}
.lead{background:var(--accent-soft);border-radius:12px;padding:14px 18px;margin-bottom:8px}
.lead ul{margin:0}
.lead b.t{display:block;margin-bottom:4px;color:var(--accent)}
.note{background:var(--sand-soft);color:var(--fg);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15.5px}
.note b{color:var(--sand)}
.q{font-weight:700}
.tbl{overflow-x:auto;margin:10px 0 16px}
table{border-collapse:collapse;min-width:100%;font-size:15.5px}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:start;vertical-align:top}
th{background:var(--accent-soft);color:var(--fg)}
td{background:var(--card)}

.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;margin-top:8px}
.term{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.term b{display:block;font-family:var(--f-head);font-size:19px;color:var(--accent)}
.term span{font-size:15.5px;color:var(--fg)}

.quizbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:30px 0 12px}
.quizbar h3{margin:0}
.score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:8px 16px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.qcard .qt{font-weight:700;margin-bottom:10px}
.qcard .qn{color:var(--muted);font-weight:500;font-size:14px;display:block;margin-bottom:2px}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;line-height:1.5;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:10px;font-size:15.5px;border-radius:10px;padding:10px 14px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{display:block}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}

.tree{overflow-x:auto;margin:10px 0 14px}
.tree svg{display:block;min-width:520px;width:100%;height:auto}
.tree text{font-family:var(--f-body);font-size:16px;font-weight:700;fill:var(--fg);text-anchor:middle}
.tree .box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.tree .box.hl{fill:var(--accent-soft);stroke:var(--accent)}
.tree .ln{stroke:var(--muted);stroke-width:1.5;fill:none}
.tree .mar{stroke:var(--sand);stroke-width:2.5;stroke-dasharray:6 4;fill:none}
.tree .lab{font-size:13px;font-weight:500;fill:var(--sand)}
.tools{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.admin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px 16px;margin-bottom:12px}
.admin h3{margin-top:12px}
.admin label{display:block;font-size:14px;color:var(--muted);margin-top:10px}
.admin input{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.arow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.amsg{margin:10px 0 0;font-size:14.5px;color:var(--muted);min-height:1.4em}
.foot{margin-top:40px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
@media (max-width:480px){body{font-size:16.5px} header.top{flex-direction:column-reverse;align-items:stretch} .tbtn{align-self:flex-start}}
@media (prefers-reduced-motion:no-preference){.qcard{transition:border-color .2s}}
</style>
<style>
  /* הסתרת תגית ה-Watermark של נטליפיי באופן מוחלט */
  iframe#netlify-badge, 
  a[href*="netlify.com"], 
  div:has(> a[href*="netlify.com"]),
  .netlify-badge {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>סיפורי אברהם</h1>
      <p>בראשית י״א – כ״ב · סיכום, מושגים וחידונים</p>
      <span class="exam" id="examLine">מבחן שכבתי בתנ״ך: חמישי 12/11, 15:00–17:00</span>
    </div>
    <div class="tools">
      <button class="tbtn" id="themeBtn" type="button" aria-label="החלפת מצב כהה/בהיר">מצב כהה / בהיר</button>
      <button class="tbtn" id="adminBtn" type="button" aria-expanded="false" aria-controls="admin">ניהול</button>
    </div>
  </header>
  <section id="admin" class="admin" hidden aria-label="ממשק ניהול">
    <form id="loginForm" autocomplete="off">
      <h3>כניסת מנהל</h3>
      <label for="aUser">שם משתמש</label><input id="aUser" type="text" autocomplete="off">
      <label for="aPass">סיסמה</label><input id="aPass" type="password" autocomplete="off">
      <div class="arow"><button class="btn" type="submit">התחברות</button><button class="btn ghost" type="button" data-close>סגירה</button></div>
      <p class="amsg" id="loginMsg" role="status"></p>
    </form>
    <form id="editForm" hidden>
      <h3>עריכת שורת המבחן</h3>
      <label for="aText">הטקסט שמופיע בראש הדף</label>
      <input id="aText" type="text" maxlength="200">
      <div class="arow">
        <button class="btn" type="submit">שמירה</button>
        <button class="btn ghost" type="button" id="aDel">מחיקת השורה</button>
        <button class="btn ghost" type="button" id="aReset">שחזור ברירת מחדל</button>
        <button class="btn ghost" type="button" id="aOut">יציאה</button>
      </div>
      <p class="amsg" id="editMsg" role="status"></p>
    </form>
  </section>
  <nav class="chips" aria-label="פרקים"><div class="row" id="chips"></div></nav>
  <main id="main" tabindex="-1"></main>
  <div class="foot">נבנה מקובץ הסיכום של המורה (סיכומי השיעורים) ומקובץ "סיפורי האבות – קובץ מסכם לתלמידים". מה שנאמר בכיתה ולא נכתב בקבצים אינו כאן, לכן כדאי להשלים מהמחברת.</div>
</div>

<script>
/* ---------- DATA ---------- */
const T = [];

T.push({id:'t11', nav:'משפחת תרח', ref:'בראשית י״א, כ״ו–ל״ב', title:'משפחתו של אברם העברי הראשון',
lead:['תרח הוליד שלושה בנים: אברם, נחור והרן.','הרן מת בחיי אביו באור כשדים. נשארו אחריו לוט, מלכה ויסכה.','נחור נשא את מלכה, אברם נשא את שרי, ושרי עקרה.','התקופה: תקופת האבות, בערך תחילת האלף השני לפנה״ס.'],
body:`
<div class="tree" role="img" aria-label="תרשים משפחת תרח"><svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg">
<rect class="box" x="265" y="8" width="110" height="40" rx="8"/><text x="320" y="34">תרח</text>
<path class="ln" d="M320 48V70M320 70H520V96M320 70H120V96M320 70V96"/>
<rect class="box hl" x="465" y="96" width="110" height="40" rx="8"/><text x="520" y="122">אברהם</text>
<rect class="box" x="265" y="96" width="110" height="40" rx="8"/><text x="320" y="122">נחור</text>
<rect class="box" x="65" y="96" width="110" height="40" rx="8"/><text x="120" y="122">הרן (מת)</text>
<path class="ln" d="M120 136V170M120 170H70V232M120 170H235V232M120 170H405V232"/>
<rect class="box" x="15" y="232" width="110" height="40" rx="8"/><text x="70" y="258">לוט</text>
<rect class="box" x="180" y="232" width="110" height="40" rx="8"/><text x="235" y="258">מלכה</text>
<rect class="box hl" x="345" y="232" width="120" height="40" rx="8"/><text x="405" y="258">יסכה / שרי</text>
<path class="mar" d="M320 136C320 190 250 190 245 232"/>
<path class="mar" d="M520 136C520 190 440 190 430 232"/>
<text class="lab" x="320" y="196">נחור נשא את מלכה</text>
<text class="lab" x="535" y="196">אברהם נשא את שרי</text>
</svg></div>
<p style="font-size:14px;color:var(--muted)">קו רציף: הורות. קו מקווקו: נישואין.</p>

<h3>הרקע ההיסטורי</h3>
<p>הפרקים הראשונים של בראשית עוסקים בתולדות האנושות כולה. מפרק י״ב מתחיל סיפור היווצרותו של עם ישראל. כדי להבין את המשפחה, חוזרים לתולדות תרח בפרק י״א.</p>
<p>תרח וכל משפחתו יצאו מאור כשדים (דרום בבל, כיום עיראק) לכיוון ארץ כנען, אך השתקעו בחרן (בגבול סוריה-טורקיה של היום). שם מת תרח.</p>
<p>בעקבות מחקר, חוקרים מקבעים את תקופת האבות בתחילת האלף השני לפני הספירה. האבות היו נודדים בין הנהרות פרת וחידקל (אזור בבל, עיראק של היום) לבין ארץ כנען, כלומר בין מזרח למערב.</p>

<h3>הדמויות</h3>
<ul>
<li><b>הרן</b>: הבן הקטן של תרח. מת עוד בחיי אביו באור כשדים. ילדיו: לוט, יסכה ומלכה.</li>
<li><b>נחור</b>: נשא את מלכה, בת אחיו הרן. מצאצאיו ייוולדו בעתיד לבן ורבקה.</li>
<li><b>אברם</b>: נשא את שרי. לפי הקובץ המסכם, יסכה ושרי הן אותה דמות (השם מתחלף). בכיתה למדתם גם שיש אומרים ששרי היא אחותו מצד אביו (בראשית כ׳ י״ב). שתי הדעות קיימות, כדאי לדעת את שתיהן.</li>
<li><b>לוט</b>: בן אחיו של אברם. נלווה אליו בהמשך.</li>
</ul>
<div class="note"><b>הבעיה המרכזית בפתיחה:</b> שרי עקרה. כל סיפורי אברהם בהמשך נעים סביב השאלה איך תקום משפחה והבטחת האל תתקיים.</div>`,
terms:[['אור כשדים','מקום מוצא המשפחה, בדרום בבל (עיראק של היום).'],['חרן','העיר בגבול סוריה-טורקיה שבה השתקעה משפחת תרח.'],['תקופת האבות','בערך תחילת האלף השני לפנה״ס. חיי נדודים בין מסופוטמיה לכנען.'],['עקרה','אישה שאינה יכולה ללדת. הבעיה שמניעה את כל סיפורי אברהם.']],
quiz:[
{q:'מי היו שלושת בני תרח?',o:['אברם, נחור והרן','אברם, לוט והרן','אברם, נחור ולוט','נחור, הרן ויצחק'],a:0,e:'בני תרח: אברם, נחור והרן. לוט הוא בנו של הרן.'},
{q:'מי מבני תרח מת בחיי אביו באור כשדים?',o:['אברם','נחור','הרן','לוט'],a:2,e:'הרן, הבן הקטן, מת בחיי תרח. את ילדיו, לוט, יסכה ומלכה, הותיר אחריו.'},
{q:'את מי נשא נחור?',o:['שרי','מלכה, בת אחיו הרן','רבקה','יסכה'],a:1,e:'נחור נשא את מלכה, בת אחיו הרן.'},
{q:'מהי הבעיה המרכזית של משפחת אברם בפתיחת הסיפור?',o:['עוני','מחלוקת עם לוט','שרי עקרה ואין ילדים','אין להם מקום מגורים'],a:2,e:'שרי עקרה. זו הבעיה שמניעה את המשך הסיפורים, ובהם ט״ז, י״ח וכ״א.'},
{q:'לאן יצאה משפחת תרח מאור כשדים, ואיפה השתקעה?',o:['יצאה לכנען והשתקעה בשכם','יצאה לכנען אך השתקעה בחרן','יצאה למצרים','יצאה לחרן והמשיכה לבבל'],a:1,e:'הם יצאו לכיוון כנען אך השתקעו בחרן, ושם מת תרח.'},
{q:'לפי החוקרים, מתי חיו האבות בערך?',o:['תחילת האלף השני לפנה״ס','סוף האלף הראשון לפנה״ס','אחרי הגלות הראשונה','לפני המבול'],a:0,e:'חוקרים מקבעים את תקופת האבות בתחילת האלף השני לפנה״ס.'}
]});

T.push({id:'t12', nav:'י״ב · לך לך', ref:'בראשית י״ב', title:'השליחות והירידה למצרים',
lead:['פס׳ א׳–ט׳: הצו "לך לך" ושבע הברכות. אברם נוסע ובונה מזבחות.','פס׳ י׳–כ׳: רעב, ירידה למצרים, "אמרי נא אחותי את", הצלה בנגעים.','מוטיבים: מבנה הדרגתי עולה, השורש ב.ר.ך, "מעשה אבות סימן לבנים".','המסר: אברהם הוא בשר ודם, טועה ולומד.'],
body:`
<h3>פס׳ א׳–ט׳: הצו האלוהי</h3>
<p class="q">"לך לך מארצך וממולדתך ומבית אביך אל הארץ אשר אראך"</p>
<ul>
<li><b>מבנה הדרגתי עולה</b> (מס׳ טיפולוגי): ארצך (הקל ביותר), מולדתך, בית אביך (הקשה ביותר). המבנה מדגיש את הניתוק הנפשי שנדרש מאברם. הצו מתחיל בקל ומסתיים בקשה.</li>
<li>הצו נפתח במילים "לך לך" ובסופו נאמר "אל הארץ אשר אראך", יעד שאינו ידוע. אברם מציית באמונה עיוורת.</li>
<li><b>שבע ברכות</b>: ואעשך לגוי גדול · ואברכך · ואגדלה שמך · והיה ברכה · ואברכה מברכיך · ומקלליך אאר · ונברכו בך כל משפחות האדמה.</li>
<li><b>השורש ב.ר.ך הוא שורש מנחה</b> בקטע.</li>

body:`

<h3>פס׳ א׳–ט״ו: האורחים והבשורה</h3>
<ul>

lead:['הניסיון הקשה ביותר: אחרי גירוש ישמעאל, אברהם נדרש להקריב את יצחק.','מילים מנחות: "הנני" (3), "בן" (10), ה.ל.ך (7), ל.ק.ח (6), "יחדיו", "ראה", "המקום".','תכלית הניסיון: ה׳ אינו חפץ בקורבן אדם.','סוף: מלאך ה׳ עוצר, שבועה וברכות.'],
body:`
<p>התמיהה המרכזית: איך ה׳ יכול לדרוש דבר לא מוסרי? האם האמונה חשובה יותר מחיי אדם? הניסיון קשה יותר כי הוא בא אחרי גירוש ישמעאל: אברהם נפרד משני בניו. הפרק עשיר באמצעים ספרותיים.</p>

<h3>פס׳ א׳–ב׳: הצו</h3>
<ul>
<li><b>"והאלוהים ניסה את אברהם"</b>: המחבר מדגיש שזה רק ניסיון, כדי להרגיע את הקורא. הקורא יודע יותר מגיבורי הסיפור, והמתח עובר אל השאלה: האם אברהם יעמוד בניסיון?</li>
<li><b>"קח נא את בנך את יחידך אשר אהבת את יצחק ולך לך אל ארץ המוריה"</b>: מבנה <b>הדרגתי עולה</b>: בנך (יש לו שני בנים), יחידך (כל אחד יחיד לאמו), אשר אהבת, את יצחק. שמו נאמר אחרון, ומקשה על אברהם.</li>
<li>"קח נא": רך יותר. "לך לך" מקשר לפרק י״ב.</li>
<li>הר המוריה = הר הבית.</li>
</ul>

<h3>השוואה בין הניסיון הראשון (י״ב) לעשירי (כ״ב)</h3>
<h4>מה דומה</h4>
<ul>
<li>שני הצווים נפתחים ב"לך לך", ובשניהם מופיעה המילה "ארץ".</li>
<li>בשניהם יש מבנה הדרגתי עולה, מהקל לקשה.</li>
<li>בשניהם היעד אינו ידוע לאברהם.</li>
<li>בשניהם אברהם מציית באמונה, בלי עוררין.</li>
</ul>
<h4>מה שונה</h4>
<ul>
<li>בניסיון הראשון אברהם נדרש לוותר על עברו: ארצו, מולדתו ובית אביו. בעשירי הוא נדרש לוותר על עתידו: יצחק.</li>
<li>בראשון הציווי מלווה בהבטחה גדולה ("ואעשך לגוי גדול"). בעשירי הציווי סותר את ההבטחה: "והעלהו שם לעולה".</li>
</ul>
<p style="font-size:15px;color:var(--muted)">לפי חז״ל אברהם עמד בעשרה ניסיונות. הראשון: "לך לך" (י״ב), האחרון: העקידה.</p>

<h3>המילים המנחות</h3>
<ul>
<li><b>"הנני"</b> חוזר 3 פעמים: פס׳ א׳ (לה׳: צייתנות ונאמנות לאל), פס׳ ז׳ (ליצחק: אהבה לבנו), פס׳ י״א (למלאך שעוצר אותו). הוא מסמל את הקונפליקט בין אהבתו לה׳ לבין אהבתו ליצחק, והכרעתו בנאמנות לאלוהיו. בסוף אברהם מצליח לקיים את שתיהן.</li>
<li><b>"בן"</b> חוזר 10 פעמים: אהבתו לבנו וגודל הקורבן.</li>
<li><b>ה.ל.ך</b> 7 פעמים, <b>ל.ק.ח</b> 6 פעמים: הצו וביצועו.</li>
<li><b>"המקום"</b> (ג, ד, ט, יד) ו<b>"ראה"</b> (ד, ח, יג, יד): רומזים לקדושתו העתידית של המקום.</li>
<li><b>"ויאמר"</b> חוזר 5 פעמים בשיחה בין אב לבן: השיחה לא קלחה, הרבה הפסקות.</li>
<li>"את בנך את יחידך" חוזר 3 פעמים.</li>
</ul>

<h3>פס׳ ג׳–י׳: הדרך והעקידה</h3>
<ul>
<li><b>"וישכם אברהם בבוקר"</b>: קם מוקדם מסערת רגשות או נדודי שינה, ומהר לקיים את הצו. אולי רצה להסתיר משרה.</li>
<li><b>ריבוי פעלים</b>: "ויחבוש", "ויקח", "ויבקע". הוא עושה הכל בעצמו, כדי לדייק בביצוע הצו. או: מסערת הרגשות שכח שיש לו עבדים. <b>סדר הפעלים</b> בפס׳ ג׳ אינו הגיוני ומראה את מצבו המבולבל (היינו מצפים שיבקע עצים לפני שיחבוש את החמור).</li>
<li><b>דמויות המשנה:</b> הנערים והחמור מסמלים את עולם היום־יום והחומר. אברהם ויצחק הם עולם הרוח והאמונה הנשגבה. הנערים הם גם דמויות נגד לאב ובן: הם נשארים יחדיו, בעוד האב והבן יאלצו בקרוב להיפרד.</li>
<li>"ונשובה אליכם" בלשון רבים: אולי להטעות את הנערים כדי שלא ימנעו, ואולי ביטוי לתקווה שלא יקריב.</li>
<li><b>הדיאלוג (פס׳ ז–ח):</b> יצחק פותח אחרי שתיקה מעיקה. "אבי" ו"בני" מדגישים קשר הדוק. יצחק שואל "איה השה לעולה?". אברהם עונה <b>"אלוהים יראה לו השה לעולה בני"</b>: תשובה מתחמקת שתומכת בבנו, ובעקיפין אומרת שהוא הקורבן.</li>
<li><b>"וילכו שניהם יחדיו"</b> פעמיים (פס׳ ו, ח). בפס׳ ו ההליכה פיזית. בפס׳ ח היא רוחנית: יצחק מבין שהוא הקורבן ובכל זאת ממשיך, באמונה שלמה כמו אביו. לכן נקרא "עקידת יצחק". חז״ל: "זה הולך לעקוד וזה להיעקד". השורש י.ח.ד מראה טראומה משותפת.</li>
<li>בפס׳ יט נאמר שאברהם שב אל נעריו, ויצחק אינו מוזכר. יש שמסיקים מכך שיצחק כעס על אביו ולא חזר איתו.</li>
<li>פס׳ ט–י: ריבוי פעלים (ויבנו, ויערוך, ויעקוד, וישם, וישלח, ויקח) מעידים על מתח שמגיע לשיא בנטילת המאכלת.</li>
</ul>

<h3>פס׳ י״א–י״ד: העצירה</h3>
<ul>
<li>מלאך ה׳ קורא <b>"אברהם אברהם"</b> פעמיים, מחשש שאברהם אכן יעקוד, כדי לעצור את המעשה.</li>
<li><b>"כי עתה ידעתי כי ירא אלוהים אתה"</b> יוצר קושי תיאולוגי: האם ה׳ לא ידע? האם הניסיונות הקודמים לא הוכיחו נאמנות? <b>פתרונות:</b> (א) המעשה יוכיח למה ה׳ בחר באברהם להיות אבי האומה. (ב) הניסיון הוא דוגמה לאנושות על מידת ההקרבה למען האמונה. (ג) ייסורי הצדיק מוכיחים לצדיק את יכולותיו המוסריות. ה׳ יודע מה יבחר האדם, אך הוא צריך להוציא את הבחירה מהכוח אל הפועל, ואז מקבל שכר.</li>
<li>ה׳ מעמיד בניסיון רק את מי שבטוח שיעמוד בו.</li>
<li>אברהם רואה איל, והאיל נתפס בסבך. המקום נקרא <b>"ה׳ יראה"</b> כי אלוהים הראה לאברהם איל, וכך מילא את משאלתו בתשובה ליצחק. "יראה" = יבחר, יעזור, יושיע. מדרש שם נוסף: שם ה׳ ראה את אמונת אברהם, ושם יראה את אמונת העם.</li>
<li><b>סיפור אטיולוגי:</b> "בהר ה׳ יראה" מסביר למה מקריבים קורבנות רק בבית המקדש, בהר הבית. "יראה" גם קשור לעלייה לרגל: "שלוש פעמים בשנה יראה כל זכורך".</li>
<li><b>הקדמת קדושת ירושלים:</b> פס׳ י״ד הוא הערה מחבר שאינה שייכת לעצם הסיפור ובאה להקדים את קדושתה של ירושלים לימי אברהם. גם הפועל "יראה" רומז לעלייה לרגל.</li>
<li><b>ממד הזמן בסיפור המקראי:</b> ככל שהסיפור מתקרב לשיאו, הוא מתארך. אחרי השיא הוא מסתיים מהר, בלי הקפדה: למשל אין מציינים שיצחק חוזר עם אברהם לבאר שבע.</li>
</ul>

<h3>פס׳ ט״ו–י״ט: הברכה והשבועה</h3>
<ul>
<li>אחרי שעמד בניסיון, אברהם זוכה בברכות כמו בפרק י״ב, והפעם נוספת <b>שבועה</b> "בי נשבעתי נאם ה׳", שנותנת תוקף.</li>
<li>ברכה חדשה: <b>"וירש זרעך את שער אויביו"</b> – ניצחון העם.</li>
</ul>

<h3>מסרים</h3>
<ul>
<li>ה׳ אינו חפץ בקורבן אדם, בניגוד לתרבויות העבודה הזרה. הסיפור מלמד על קדושת החיים.</li>
<li>האמונה והנאמנות לה׳ קודמות לכל דבר אחר.</li>
<li>תקיעת שופר (מקרן איל) בראש השנה מזכירה את העקידה ואת אמונת האבות, ובזכותה מבקשים רחמים.</li>
<li>פרשת העקידה נאמרת בתפילת שחרית מדי יום.</li>
</ul>`,

lead:['טבלת מילים מנחות מכל הפרקים.','שאלות מעורבות מכל הפרקים. כל לחיצה על "שאלות חדשות" מערבבת מחדש.'],
body:`
<h3>מילים ושורשים מנחים</h3>
<div class="tbl"><table><tr><th>המילה</th><th>הפרק</th><th>מה היא מדגישה</th></tr>
<tr><td>ב.ר.ך</td><td>י״ב</td><td>הברכות לאברם, ותפקידו כברכה לכל משפחות האדמה</td></tr>

<tr><td>ה.ל.ך / ל.ק.ח</td><td>כ״ב</td><td>7 ו־6 פעמים: הצו וביצועו</td></tr>
<tr><td>"ויאמר"</td><td>כ״ב ז–ח</td><td>5 פעמים: שיחה לא קלחה, מתח</td></tr>
<tr><td>"יחדיו"</td><td>כ״ב</td><td>הליכה פיזית ואחר כך רוחנית. טראומה משותפת</td></tr>
<tr><td>"המקום", "ראה"</td><td>כ״ב</td><td>קדושתו העתידית של הר המוריה</td></tr></table></div>

<h3>מושגים שחוזרים בכמה פרקים</h3>
<ul>
<li><b>מבנה הדרגתי עולה:</b> י״ב 1 וכ״ב 2.</li>
<li><b>מדרש שם:</b> ישמעאל, באר לחי ראי, יצחק, באר שבע, ה׳ יראה.</li>
<li><b>סיפור אטיולוגי:</b> הגר (סכסוך עם ישמעאל), העקידה (קורבנות רק בהר הבית).</li>
<li><b>מעשה אבות סימן לבנים:</b> הירידה למצרים, ברית בין הבתרים.</li>
<li><b>מוטיב העקרות:</b> שרה בט״ז, כ״א וי״ח.</li>

terms:[],quiz:[]};

/* ---------- STATE ---------- */
const $ = s => document.querySelector(s);
let store = {};
try { store = JSON.parse(localStorage.getItem('avraham-quiz-v1') || '{}'); } catch(e){ store = {}; }
function save(){ try { localStorage.setItem('avraham-quiz-v1', JSON.stringify(store)); } catch(e){} }
T.forEach(t => t.quiz.forEach((q,i) => q.id = t.id + '-' + i));
const pages = T.concat([REVIEW]);

function score(t){ const qs = t.id==='review' ? [].concat(...T.map(x=>x.quiz)) : t.quiz; return [qs.filter(q => store[q.id]===1).length, qs.length]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ---------- RENDER ---------- */
function renderChips(cur){
  $('#chips').innerHTML = pages.map(p => {
    const [c,n] = score(p);
    const sm = n ? `<small>${c}/${n}</small>` : '';
    return `<button class="chip${n && c===n ? ' full':''}" type="button" data-id="${p.id}" aria-current="${p.id===cur}">${p.nav}${sm}</button>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
  const a = document.querySelector('.chip[aria-current="true"]'); if(a) a.scrollIntoView({inline:'center', block:'nearest'});
}

function quizHTML(list, ordered){
  return list.map((q,qi) => {
    const idx = shuffle(q.o.map((_,i)=>i));
    return `<div class="qcard" data-q="${q.id}" data-a="${q.a}">
      <span class="qn">שאלה ${qi+1} מתוך ${list.length}</span>
      <div class="qt">${q.q}</div>
      <div class="opts">${idx.map(i => `<button class="opt" type="button" data-i="${i}">${q.o[i]}</button>`).join('')}</div>
      <div class="fb" hidden></div></div>`;
  }).join('');
}

function bindQuiz(root, pageId, list){
  const upd = () => {
    const s = root.querySelector('.score');
    if(s){ const c = list.filter(q => store[q.id]===1).length; s.textContent = `נכון: ${c} מתוך ${list.length}`; }
    renderChips(pageId);
  };
  root.querySelectorAll('.qcard').forEach(card => {
    const q = list.find(x => x.id === card.dataset.q);
    card.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
      const picked = +btn.dataset.i, ok = picked === q.a;
      card.querySelectorAll('.opt').forEach(b => { b.disabled = true; if(+b.dataset.i===q.a) b.classList.add('right'); });
      if(!ok) btn.classList.add('wrong');
      const fb = card.querySelector('.fb');
      fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok':'no');
      fb.innerHTML = `<b>${ok ? 'נכון' : 'לא נכון'}</b>${q.e}`;
      store[q.id] = ok ? 1 : 0; save(); upd();
    });
  });
  const rs = root.querySelector('[data-reset]');
  if(rs) rs.onclick = () => { list.forEach(q => delete store[q.id]); save(); show(pageId); };
  const nw = root.querySelector('[data-new]');
  if(nw) nw.onclick = () => show('review', true);
}

function show(id, fresh){
  const p = pages.find(x => x.id === id) || pages[0];
  const i = pages.indexOf(p);
  const main = $('#main');
  let list = p.quiz, quizTitle = 'בדקו את עצמכם';
  if(p.id==='review'){ list = shuffle([].concat(...T.map(t=>t.quiz))).slice(0,15); quizTitle = '15 שאלות מעורבות'; }
  const terms = p.terms.length ? `<h3>מושגים חשובים</h3><div class="terms">${p.terms.map(t=>`<div class="term"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div>` : '';
  const [c,n] = score(p);
  main.innerHTML = `
    <div class="eyebrow">${p.ref}</div>
    <h2 class="title">${p.title}</h2>
    <div class="lead"><b class="t">במבט אחד</b><ul>${p.lead.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    ${p.body}${terms}
    <div class="quizbar"><h3>${quizTitle}</h3><span class="score">נכון: ${p.id==='review'?list.filter(q=>store[q.id]===1).length:c} מתוך ${list.length}</span></div>
    <div class="quizlist">${quizHTML(list)}</div>
    <div class="pager">
      ${p.id==='review' ? '<button class="btn" type="button" data-new>שאלות חדשות</button>' : '<button class="btn ghost" type="button" data-reset>איפוס החידון</button>'}
      ${i<pages.length-1 ? `<button class="btn" type="button" data-go="${pages[i+1].id}">הפרק הבא: ${pages[i+1].nav}</button>` : ''}
    </div>`;
  main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
  bindQuiz(main, p.id, list);
  renderChips(p.id);
  if(!fresh) window.scrollTo({top:0});
  else window.scrollTo({top: main.querySelector('.quizbar').offsetTop - 120});
}

function route(){ const h = location.hash.replace('#',''); show(pages.some(p=>p.id===h) ? h : pages[0].id); }
addEventListener('hashchange', route);

/* theme toggle */
$('#themeBtn').onclick = () => {
  const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
};
route();

/* ---------- ADMIN: edit / delete the exam line (works in this browser; shared default comes from config.json) ---------- */
const DEFAULT_EXAM = 'מבחן שכבתי בתנ״ך: חמישי 12/11, 15:00–17:00';
const CRED_HASH = 'cf8c4bc94b602b58ebfa17fc5b3df9b92c36b34f94fcf9fe9be4b200b94c8e2b';
const LS_KEY = 'avraham-exam-override';
let baseState = {text: DEFAULT_EXAM, hidden: false}, examState = baseState, loggedIn = false;

function readOverride(){ try { const v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function writeOverride(v){ try { if(v) localStorage.setItem(LS_KEY, JSON.stringify(v)); else localStorage.removeItem(LS_KEY); return true; } catch(e){ return false; } }
function applyExam(){
  const el = $('#examLine');
  el.textContent = examState.text;
  el.hidden = examState.hidden || !examState.text;
}
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}
function setAdminView(){
  $('#loginForm').hidden = loggedIn; $('#editForm').hidden = !loggedIn;
  if(loggedIn) $('#aText').value = examState.text;
}
function openAdmin(open){
  $('#admin').hidden = !open; $('#adminBtn').setAttribute('aria-expanded', String(open));
  if(open){ setAdminView(); (loggedIn ? $('#aText') : $('#aUser')).focus(); }
}
function saveExam(next, okMsg){
  examState = next; applyExam();
  const ok = writeOverride(next);
  $('#editMsg').textContent = ok ? okMsg + ' השינוי נשמר בדפדפן הזה בלבד. כדי שכולם יראו אותו, ערכו את config.json והעלו מחדש.' : 'השינוי מוצג עכשיו, אך הדפדפן לא מאפשר לשמור אותו.';
}
$('#adminBtn').onclick = () => openAdmin($('#admin').hidden);
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => openAdmin(false));
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const m = $('#loginMsg');
  try {
    const h = await sha256($('#aUser').value + ':' + $('#aPass').value);
    if(h === CRED_HASH){ loggedIn = true; $('#aPass').value = ''; m.textContent = ''; setAdminView(); $('#aText').focus(); }
    else m.textContent = 'שם משתמש או סיסמה שגויים.';
  } catch(err){ m.textContent = 'לא ניתן לאמת כרגע. נסו שוב.'; }
};
$('#editForm').onsubmit = e => {
  e.preventDefault();
  const t = $('#aText').value.trim();
  if(!t){ $('#editMsg').textContent = 'הטקסט ריק. כדי להסיר את השורה השתמשו ב"מחיקת השורה".'; return; }
  saveExam({text:t, hidden:false}, 'נשמר.');
};
$('#aDel').onclick = () => { saveExam({text:'', hidden:true}, 'השורה נמחקה.'); $('#aText').value = ''; };
$('#aReset').onclick = () => { writeOverride(null); examState = baseState; applyExam(); $('#aText').value = examState.text; $('#editMsg').textContent = 'חזרנו לטקסט שב-config.json.'; };
$('#aOut').onclick = () => { loggedIn = false; $('#aUser').value = ''; openAdmin(false); };

(async () => {
  try {
    const r = await fetch('config.json', {cache:'no-store'});
    if(r.ok){ const c = await r.json(); baseState = {text: String(c.examLine ?? DEFAULT_EXAM), hidden: !!c.hidden}; }
  } catch(e){}
  const o = readOverride();
  examState = o || baseState;
  applyExam();
})();
</script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    // חיפוש והסרה של כפתור ה-Netlify לפי כתובת או מזהה
    const netlifyBadge = document.querySelector('iframe#netlify-badge, a[href*="netlify.com"], .netlify-badge');
    if (netlifyBadge) {
      netlifyBadge.remove();
    }
    
    // ניטור למקרה שהכפתור נטען באיחור דינמי
    const observer = new MutationObserver((mutations, obs) => {
      const badge = document.querySelector('iframe#netlify-badge, a[href*="netlify.com"], div:has(> a[href*="netlify.com"]), .netlify-badge');
      if (badge) {
        badge.remove();
        obs.disconnect(); // מפסיק לעקוב ברגע שהוסר
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>
</body>
